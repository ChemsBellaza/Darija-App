      const byUnit = {};
      res.results.forEach(r => { const u = r.ex.unit; byUnit[u] = byUnit[u] !== false && r.ok; });
      let k = 0;
      for (const u of DB.units) { if (byUnit[u.id] === true) k = u.index + 1; else break; }
      ctx.close = () => { ctx.layer.remove(); };
      endScreen(ctx, res, { title: k ? `Niveau : unité ${k + 1}` : 'On commence au début !', proud: k >= 2,
        line: k ? { dz: 'Wa3er! Ta3ref chwiya', fr: 'Balèze ! Tu en sais déjà un peu' } : { dz: 'Ma3lich, yallah nebdaw', fr: 'Pas grave, allez on commence' },
        sub: k ? `Tu maîtrises déjà ${k} unité${k > 1 ? 's' : ''}. Elles restent accessibles pour réviser.` : 'C’est fait pour ça. Yallah !', btn: 'C’est parti', after: () => finishOnboarding(k) });
    }
  });
}
function finishOnboarding(k) {
  S.placementUnit = k;
  DB.units.slice(0, k).forEach(u => u.lessons.forEach(l => { if (!lessonDone(l.id)) S.lessons[l.id] = { done: true, stars: 0, placed: true, acc: 0 }; }));
  S.onboarded = true; S.heartsAt = Date.now();
  if (!Profiles.guest && !Profiles.current) Profiles.adoptGuest(S.name);
  save(); TAB = 'learn'; renderApp();
}

/* =====================================================================
   DUEL — quiz de 10 questions encodé dans le lien (#duel=…), sans serveur
   ===================================================================== */
const b64u = {
  enc(obj) { const bytes = new TextEncoder().encode(JSON.stringify(obj)); let bin = ''; bytes.forEach(b => bin += String.fromCharCode(b)); return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); },
  dec(str) { str = String(str).trim().replace(/-/g, '+').replace(/_/g, '/'); while (str.length % 4) str += '='; const bin = atob(str); const bytes = Uint8Array.from(bin, c => c.charCodeAt(0)); return JSON.parse(new TextDecoder().decode(bytes)); }
};
const DUEL_T = { f: 'mcq_fr2dz', d: 'mcq_dz2fr', l: 'listen' };
function baseURL() { return location.href.split('#')[0]; }
function linkWorks() { return /^https?:$/.test(location.protocol) && !/^(localhost|127\.)/.test(location.hostname); }
function duelPool() {
  const units = DB.units.filter(u => lessonUnlocked(u.lessons[0]));
  const ws = (units.length ? units : [DB.units[0]]).flatMap(u => u.words);
  return ws.length >= 12 ? ws : DB.wordList;
}
function makeDuelQuestions() {
  const ws = shuffle(duelPool()).slice(0, 10), types = ['f', 'd', 'l'];
  return ws.map((w, i) => { const t = types[i % 3]; const opts = shuffle([w.id].concat(distractors(w, 3))); return [t, w.id, opts]; });
}
function duelExercises(q) { return q.filter(x => getItem(x[1]) && x[2].every(getItem)).map(x => ({ type: DUEL_T[x[0]] || 'mcq_fr2dz', item: x[1], opts: x[2], srs: [] })); }
function parseDuelInput(txt) {
  txt = String(txt || '').trim(); if (!txt) return null;
  let kind = null, code = txt;
  const m = txt.match(/#?(duelr|duel|week)=([A-Za-z0-9_\-]+)/);
  if (m) { kind = m[1]; code = m[2]; }
  try { const o = b64u.dec(code); if (!o || o.v !== 1 || (!o.id && !o.w)) return null; return { kind: kind || (o.w ? 'week' : o.fs != null ? 'duelr' : 'duel'), data: o }; } catch (e) { return null; }
}
function duelLayer(title) {
  const layer = document.createElement('div'); layer.className = 'layer';
  layer.innerHTML = `<div class="layer-head"><button class="close" id="dlx" aria-label="Fermer">${ICON.close}</button><b class="grow ttl">⚔️ ${esc(title)}</b></div><div class="layer-body" id="dlb"></div><div class="layer-foot" id="dlf"></div>`;
  document.body.appendChild(layer);
  $('#dlx', layer).onclick = () => { layer.remove(); refresh(); };
  return { layer, body: $('#dlb', layer), foot: $('#dlf', layer), close: () => { layer.remove(); refresh(); } };
}
function duelHome() {
  const L = duelLayer('Duel');
  L.body.innerHTML = `<div class="center" style="font-size:56px">⚔️</div><h2 class="center">Défie un ami</h2>
    <p class="muted center">10 questions de Darija. Tu joues d’abord, puis tu envoies le lien : ton ami joue les mêmes questions et te renvoie son résultat.</p>
    <div class="card"><label class="small muted" style="font-weight:800">Ton prénom</label><input id="dName" class="search" style="background-image:none;padding-left:14px;margin-top:6px" maxlength="24" value="${esc(S.name)}" placeholder="Ex. Sofia" autocomplete="off">
      <button class="btn" id="dNew" style="margin-top:12px">Créer un duel</button></div>
    <div class="section-t">Tu as reçu un défi ou un résultat ?</div>
    <div class="card"><textarea class="txt-in" id="dCode" style="min-height:80px" placeholder="Colle ici le lien ou le code reçu"></textarea><button class="btn ghost" id="dOpen" style="margin-top:10px">Ouvrir</button></div>`;
  $('#dNew', L.body).onclick = () => {
    const n = $('#dName', L.body).value.trim(); if (!n) { toast('Indique ton prénom pour que ton ami sache qui le défie'); return; }
    S.name = n; save(); L.layer.remove(); createDuel();
  };
  $('#dOpen', L.body).onclick = () => {
    const p = parseDuelInput($('#dCode', L.body).value);
    if (!p) { toast('❌ Lien ou code de duel invalide'); return; }
    L.layer.remove(); p.kind === 'week' ? receiveWeekly(p.data) : p.kind === 'duelr' ? duelResult(p.data) : duelChallenge(p.data);
  };
}
function createDuel() {
  const q = makeDuelQuestions(), id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  runSession({
    title: 'Duel', exercises: duelExercises(q), mode: 'duel', hearts: false, xpPer: 0, retry: false, badge: '⚔️ Duel', quitMsg: 'Abandonner ce duel ?', onClose: refresh,
    onEnd(res, ctx) {
      const payload = { v: 1, id, n: S.name, s: res.correct, tm: res.seconds, q };
      S.duels[id] = { id, role: 'creator', me: S.name, myScore: res.correct, myTime: res.seconds, them: null, theirScore: null, date: Date.now() };
      addXP(10); markActivity(); save();
      ctx.layer.remove(); shareDuel(payload);
    }
  });
}
function shareBlock(L, url, code, label, text) {
  L.body.insertAdjacentHTML('beforeend', `<div class="card" style="margin-top:14px"><h3>${label}</h3>
    ${linkWorks() ? '' : '<div class="warn" style="margin:8px 0">Ton app n’est pas hébergée en ligne (fichier local), donc le lien ne s’ouvrira pas chez ton ami. Envoie plutôt le <b>code</b> : il le colle dans Duel → « Tu as reçu un défi ? ». Héberge le fichier (GitHub Pages, Netlify…) pour partager un vrai lien.</div>'}
    <div class="code-box" id="dlCode">${esc(linkWorks() ? url : code)}</div>
    <div class="row" style="margin-top:10px"><button class="btn blue grow" id="dlShare">📤 Partager</button><button class="btn ghost grow" id="dlCopy">📋 Copier</button></div></div>`);
  const payloadText = linkWorks() ? url : code;
  $('#dlCopy', L.body).onclick = () => copyText(payloadText, 'Copié ✓ Envoie-le à ton ami !');
  $('#dlShare', L.body).onclick = () => {
    if (navigator.share) navigator.share({ title: 'Kelma', text: text + (linkWorks() ? '' : '\nCode : ' + code), url: linkWorks() ? url : undefined }).catch(() => {});
    else copyText(payloadText, 'Copié ✓ Colle-le dans ta messagerie');
  };
}
function shareDuel(p) {
  const code = b64u.enc(p), url = baseURL() + '#duel=' + code;
  const L = duelLayer('Duel créé');
  L.body.innerHTML = `<div class="center" style="font-size:56px">🎯</div><h2 class="center">Ton score : ${p.s}/10</h2><p class="muted center">en ${fmtTime(p.tm)}. Envoie maintenant le défi à ton ami — ton score reste caché jusqu’à ce qu’il ait joué.</p>`;
  shareBlock(L, url, code, 'Lien du défi', `⚔️ ${p.n} te défie en Darija ! 10 questions, bats mon score.`);
  L.foot.innerHTML = '<button class="btn ghost" id="dlDone">Terminé</button>';
  $('#dlDone', L.foot).onclick = L.close;
}
function duelChallenge(p) {
  if (S.duels[p.id] && S.duels[p.id].role === 'creator') { toast('C’est ton propre duel : envoie-le à un ami !'); shareDuel(p); return; }
  const L = duelLayer('Défi reçu');
  const exs = duelExercises(p.q || []);
  L.body.innerHTML = `<div class="center" style="font-size:56px">⚔️</div><h2 class="center">${esc(p.n)} te défie !</h2>
    <p class="muted center">${exs.length} questions de Darija. Son score est caché jusqu’à la fin. Réponds vite et bien : en cas d’égalité, le plus rapide gagne.</p>
    <div class="card"><label class="small muted" style="font-weight:800">Ton prénom</label><input id="dgName" class="search" style="background-image:none;padding-left:14px;margin-top:6px" maxlength="24" value="${esc(S.name)}" placeholder="Ton prénom" autocomplete="off"></div>`;
  L.foot.innerHTML = '<button class="btn" id="dgGo">Relever le défi</button>';
  $('#dgGo', L.foot).onclick = () => {
    const n = $('#dgName', L.body).value.trim() || 'Ami'; S.name = S.name || n; save();
    L.layer.remove();
    if (!exs.length) { toast('❌ Ce duel est vide ou incompatible avec ta version'); return; }
    runSession({
      title: 'Duel', exercises: exs, mode: 'duel', hearts: false, xpPer: 0, retry: false, badge: '⚔️ ' + p.n, onClose: refresh,
      onEnd(res, ctx) {
        const r = { v: 1, id: p.id, n: p.n, s: p.s, tm: p.tm, fn: n, fs: res.correct, ftm: res.seconds };
        S.duels[p.id] = { id: p.id, role: 'guest', me: n, myScore: res.correct, myTime: res.seconds, them: p.n, theirScore: p.s, theirTime: p.tm, date: Date.now() };
        addXP(10); markActivity(); award('duel'); save();
        ctx.layer.remove(); showVS(r, 'guest');
      }
    });
  };
}
function duelResult(r) {
  const d = S.duels[r.id];
  if (d && d.role === 'creator') { d.them = r.fn; d.theirScore = r.fs; d.theirTime = r.ftm; save(); award('duel'); }
  showVS(r, d && d.role === 'creator' ? 'creator' : 'viewer');
}
function showVS(r, role) {
  const L = duelLayer('Résultat du duel');
  const meIsCreator = role !== 'guest';
  const A = { n: r.n, s: r.s, t: r.tm }, B = { n: r.fn, s: r.fs, t: r.ftm };
  const winner = A.s !== B.s ? (A.s > B.s ? A : B) : (A.t !== B.t ? (A.t < B.t ? A : B) : null);
  const myName = meIsCreator ? A.n : B.n;
  const verdict = !winner ? 'Égalité parfaite !' : (role === 'viewer' ? winner.n + ' gagne !' : (winner.n === myName ? 'Tu as gagné ! 🏆' : 'Perdu… revanche ? 💪'));
  L.body.innerHTML = `<h2 class="center" style="margin-top:10px">${esc(verdict)}</h2>
    <div class="duel-vs"><div><div class="small muted" style="font-weight:900">${esc(A.n)}</div><div class="sc" style="color:var(--green2)">${A.s}</div><div class="small muted">${fmtTime(A.t || 0)}</div></div><div class="vs">VS</div><div><div class="small muted" style="font-weight:900">${esc(B.n)}</div><div class="sc" style="color:var(--red)">${B.s}</div><div class="small muted">${fmtTime(B.t || 0)}</div></div></div>`;
  if (winner && (role === 'viewer' || winner.n === myName)) { confetti(); Sfx.play('end'); }
  if (role === 'guest') {
    const code = b64u.enc(r), url = baseURL() + '#duelr=' + code;
    L.body.insertAdjacentHTML('beforeend', '<p class="muted center">Renvoie ton résultat à ' + esc(r.n) + ' pour qu’il voie la comparaison.</p>');
    shareBlock(L, url, code, 'Lien de résultat', `⚔️ Duel Kelma : ${r.fn} ${r.fs}/10 contre ${r.n} ${r.s}/10 !`);
  }
  L.foot.innerHTML = `<button class="btn" id="dvNew">${role === 'guest' && !S.onboarded ? 'Découvrir Kelma' : 'Nouveau duel'}</button>`;
  $('#dvNew', L.foot).onclick = () => { L.layer.remove(); if (!S.onboarded) { renderApp(); return; } duelHome(); };
}
function handleHash() {
  const h = location.hash || '';
  if (!/(duelr?|week)=/.test(h)) return;
  const p = parseDuelInput(h);
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
  if (!p) { toast('❌ Lien de duel invalide ou abîmé'); return; }
  setTimeout(() => p.kind === 'week' ? receiveWeekly(p.data) : p.kind === 'duelr' ? duelResult(p.data) : duelChallenge(p.data), 50);
}

/* =====================================================================
   BOOT
   ===================================================================== */
async function boot() {
  buildDB(); Voice.init();
  await Profiles.init();
  const ids = Profiles.ids();
  if (Profiles.current && (ids.length > 1 || Profiles.states[Profiles.current].pinHash)) { S = migrate(defaultState()); }
  else if (Profiles.current) Profiles.enter(Profiles.current);
  syncHearts(); applyTheme();
  if (window.matchMedia) { try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme); } catch (e) {} }
  /* iPhone : les couches plein écran suivent la zone visible quand le clavier s’ouvre,
     pour que le champ de réponse et le bouton Vérifier restent visibles */
  if (window.visualViewport) {
    const vv = window.visualViewport, root = document.documentElement;
    const upd = () => {
      const kb = innerHeight - vv.height > 120;
      root.style.setProperty('--vvh', (kb ? vv.height : innerHeight) + 'px');
      root.style.setProperty('--vvt', (kb ? vv.offsetTop : 0) + 'px');
      document.body.classList.toggle('kb-open', kb);
    };
    vv.addEventListener('resize', upd); vv.addEventListener('scroll', upd); upd();
  }
  /* iOS : l’audio et la voix doivent être « débloqués » par un premier geste */
  document.addEventListener('pointerdown', () => { Sfx.ensure(); try { if ('speechSynthesis' in window) { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } } catch (e) {} }, { once: true });
  if (Profiles.current && (ids.length > 1 || Profiles.states[Profiles.current].pinHash)) renderPicker(); /* le lien (#duel, #week) sera ouvert après le choix du profil */
  else { renderApp(); handleHash(); }
  /* PWA : service worker seulement quand l’app est servie en http(s) (pas en fichier local) */
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
  /* demande discrète de stockage durable quand l’app est installée */
  if ((window.navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches)) && Profiles.persisted === false) Profiles.askPersist();
  window.addEventListener('hashchange', handleHash);
  setInterval(() => { const before = S.hearts; syncHearts(); if (S.hearts !== before) { save(); if (TAB === 'learn' && !$('#session')) refresh(); } }, 60000);
  window.addEventListener('pagehide', () => { save(); Profiles.flush(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) Profiles.flush(); });
}
document.addEventListener('DOMContentLoaded', boot);

</script>
